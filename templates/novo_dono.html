{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-emerald-700 mb-6">Novo Dono</h2>

    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium mb-1">Nome</label>
            <input type="text" name="nome" required maxlength="100" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">NIF</label>
            <input type="text" name="nif" maxlength="9" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Telefone</label>
            <input type="text" name="telefone" maxlength="15" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email" maxlength="100" class="w-full rounded-lg border px-3 py-2">
        </div>

        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg">
            Guardar
        </button>
    </form>
</div>
{% endblock %}
