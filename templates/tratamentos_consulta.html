{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-emerald-700 mb-6">Tratamentos da Consulta</h2>

    <p class="mb-4">Animal: {{ consulta[5] }}, Veterinário: {{ consulta[6] }}</p>

    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium mb-1">Tratamento</label>
            <select name="id_tratamento" required class="w-full rounded-lg border px-3 py-2">
                <option value="">Selecione...</option>
                {% for t in tratamentos %}
                    <option value="{{ t[0] }}">{{ t[1] }} - €{{ "%.2f"|format(t[2]) }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Quantidade</label>
            <input type="number" name="quantidade" min="1" value="1" required class="w-full rounded-lg border px-3 py-2">
        </div>

        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg">
            Adicionar tratamento
        </button>
    </form>

    <div class="mt-6">
        <a href="{{ url_for('consultas') }}" class="text-emerald-700 hover:underline">Voltar às consultas</a>
    </div>
</div>
{% endblock %}
