{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-center text-emerald-700 mb-6">Login</h2>

    <form method="post" class="space-y-4">
        <!-- Token CSRF para impedir submissões forjadas -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input
                type="text"
                name="username"
                required
                maxlength="50"
                class="w-full rounded-lg border px-3 py-2"
            >
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input
                type="password"
                name="password"
                required
                maxlength="128"
                class="w-full rounded-lg border px-3 py-2"
            >
        </div>

        <button
            type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg"
        >
            Entrar
        </button>
    </form>
</div>
{% endblock %}
