{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-emerald-700 mb-6">Editar Animal</h2>

    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium mb-1">Nome</label>
            <input type="text" name="nome" value="{{ animal[1] }}" required maxlength="100" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Espécie</label>
            <input type="text" name="especie" value="{{ animal[2] }}" required maxlength="50" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Raça</label>
            <input type="text" name="raca" value="{{ animal[3] or '' }}" maxlength="50" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Data de nascimento</label>
            <input type="date" name="data_nascimento" value="{{ animal[4] }}" class="w-full rounded-lg border px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Dono</label>
            <select name="id_dono" required class="w-full rounded-lg border px-3 py-2">
                {% for d in donos %}
                    <option value="{{ d[0] }}" {% if d[0] == animal[5] %}selected{% endif %}>{{ d[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg">
            Atualizar
        </button>
    </form>
</div>
{% endblock %}
