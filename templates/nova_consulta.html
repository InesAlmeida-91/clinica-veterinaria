{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-emerald-700 mb-6">Nova Consulta</h2>

    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium mb-1">Data da consulta</label>
            <input
                type="datetime-local"
                name="data_consulta"
                min="{{ min_datetime }}"
                value="{{ form_data.data_consulta if form_data else '' }}"
                required
                class="w-full rounded-lg border px-3 py-2"
            >
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Motivo</label>
            <input
                type="text"
                name="motivo"
                value="{{ form_data.motivo if form_data else '' }}"
                required
                maxlength="255"
                class="w-full rounded-lg border px-3 py-2"
            >
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Animal</label>
            <select name="id_animal" required class="w-full rounded-lg border px-3 py-2">
                <option value="">Selecione...</option>
                {% for a in animais %}
                    <option value="{{ a[0] }}" {% if form_data and form_data.id_animal == a[0]|string %}selected{% endif %}>
                        {{ a[1] }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Veterinário</label>
            <select name="id_vet" required class="w-full rounded-lg border px-3 py-2">
                <option value="">Selecione...</option>
                {% for v in veterinarios %}
                    <option value="{{ v[0] }}" {% if form_data and form_data.id_vet == v[0]|string %}selected{% endif %}>
                        {{ v[1] }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg">
            Marcar Consulta
        </button>
    </form>
</div>
{% endblock %}
